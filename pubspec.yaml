name: mume
description: Offline-first local music player.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"
dependencies:
  flutter: { sdk: flutter }
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.1
  share_plus: ^10.0.2
  on_audio_query: ^2.9.0
  just_audio_background: ^0.0.1-beta.17
  just_audio: ^0.10.6
  device_info_plus: ^10.1.0
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true